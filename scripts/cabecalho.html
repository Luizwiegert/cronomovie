<!doctype html>
<!-- Fonte do cabeçalho de perfil (marca/cronomovie-cabecalho.png), 1500x500.
     Pra perfis em que a foto redonda fica por cima do canto esquerdo (Gravatar, LinkedIn, X):
     sem nome, só a linha do tempo chegando no ponto vermelho, do meio pra direita.
     Gerar: msedge --headless=new --window-size=1500,500 --screenshot=marca/cronomovie-cabecalho.png scripts/cabecalho.html -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0}
  body{
    width:1500px;height:500px;overflow:hidden;
    background:#0B0B0C radial-gradient(ellipse 46% 95% at 80% 50%,rgba(122,36,40,.46) 0%,rgba(122,36,40,.2) 40%,rgba(122,36,40,.05) 72%,rgba(122,36,40,0) 100%);
  }
  svg{display:block;width:1500px;height:500px}
</style>
</head>
<body>
  <svg viewBox="0 0 1500 500" aria-hidden="true">
    <defs>
      <linearGradient id="trilho" gradientUnits="userSpaceOnUse" x1="560" y1="0" x2="1230" y2="0">
        <stop offset="0" stop-color="#F2F1EE" stop-opacity="0"/>
        <stop offset=".35" stop-color="#F2F1EE" stop-opacity=".3"/>
        <stop offset="1" stop-color="#F2F1EE" stop-opacity=".46"/>
      </linearGradient>
    </defs>
    <line x1="560" y1="250" x2="1230" y2="250" stroke="url(#trilho)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="800" cy="250" r="9" fill="#F2F1EE" opacity=".55"/>
    <circle cx="930" cy="250" r="11" fill="#F2F1EE" opacity=".8"/>
    <circle cx="1070" cy="250" r="13" fill="#F2F1EE"/>
    <circle cx="1230" cy="250" r="64" fill="none" stroke="#E5484D" stroke-width="2" opacity=".28"/>
    <circle cx="1230" cy="250" r="36" fill="#E5484D"/>
  </svg>
</body>
</html>
