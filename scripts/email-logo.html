<!doctype html>
<!-- Fonte da logo usada nos e-mails (public/email-logo.png), 880x240, mostrada em 220x60.
     Fundo chapado igual ao do e-mail (#0B0B0C), sem brilho, pra não aparecer a borda da imagem.
     Gerar: msedge --headless=new --window-size=880,240 --virtual-time-budget=8000
            --screenshot=public/email-logo.png scripts/email-logo.html -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&display=block" rel="stylesheet">
<style>
  html,body{margin:0}
  body{width:880px;height:240px;overflow:hidden;display:flex;align-items:center;background:#0B0B0C;color:#F2F1EE}
  .brand{display:flex;align-items:center;gap:.2em;font-size:136px}
  .mark{flex:none;width:1.36em;height:.68em;color:#F2F1EE}
  .wordmark{font:900 1em/1 "Big Shoulders Display","Arial Narrow",Impact,sans-serif;letter-spacing:.005em}
  .wordmark span{color:#E5484D}
</style>
</head>
<body>
  <div class="brand">
    <svg class="mark" viewBox="0 0 64 32" aria-hidden="true"><line x1="8" y1="16" x2="48" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".42"/><circle cx="8" cy="16" r="4" fill="currentColor"/><circle cx="24" cy="16" r="4" fill="currentColor"/><circle cx="48" cy="16" r="11" fill="#E5484D"/></svg>
    <span class="wordmark">Crono<span>movie</span></span>
  </div>
</body>
</html>
